name: Build TWRP dew

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            zip \
            unzip \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libncurses5-dev \
            ccache \
            python3 \
            python3-pip \
            libxml2-utils \
            xsltproc \
            lz4 \
            zstd

      - name: Verify device tree
        run: |
          test -f device/xiaomi/dew/AndroidProducts.mk
          test -f device/xiaomi/dew/BoardConfig.mk
          test -f device/xiaomi/dew/device.mk
          test -f device/xiaomi/dew/twrp_dew.mk

          echo "Device tree OK"

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache --max-size=10G
          ccache --set-config=compression=true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: twrp-ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            twrp-ccache-${{ runner.os }}-

      - name: Build TWRP
        run: |
          source build/envsetup.sh
          lunch twrp_dew-eng
          mka -j$(nproc) recoveryimage

      - name: Upload TWRP
        uses: actions/upload-artifact@v4
        with:
          name: twrp-dew
          path: |
            out/target/product/dew/*.img
