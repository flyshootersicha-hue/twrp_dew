
name: Build TWRP dew

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # 1. Checkout your device tree
      # ==========================================
      - name: Checkout device tree
        uses: actions/checkout@v4

      # ==========================================
      # 2. Check device tree BEFORE syncing TWRP
      # ==========================================
      - name: Verify device tree
        run: |
          echo "=== Repository device tree ==="
          find device/xiaomi/dew -maxdepth 3 -type f | sort

          echo ""
          echo "=== Required files ==="
          test -f device/xiaomi/dew/AndroidProducts.mk
          test -f device/xiaomi/dew/BoardConfig.mk
          test -f device/xiaomi/dew/device.mk
          test -f device/xiaomi/dew/twrp_dew.mk

          echo ""
          echo "=== Architecture ==="
          grep -nE "TARGET_ARCH|TARGET_SUPPORTS_64_BIT_APPS" \
            device/xiaomi/dew/BoardConfig.mk || true

          echo ""
          echo "=== Dynamic partitions ==="
          grep -n "PRODUCT_USE_DYNAMIC_PARTITIONS" \
            device/xiaomi/dew/*.mk || true

      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            zip \
            unzip \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libncurses5-dev \
            ccache \
            python3 \
            python3-pip \
            libxml2-utils \
            xsltproc \
            lz4 \
            zstd

      # ==========================================
      # 4. Install repo
      # ==========================================
      - name: Install repo
        run: |
          mkdir -p ~/bin

          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo

          chmod +x ~/bin/repo

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # ==========================================
      # 5. Sync TWRP source
      # ==========================================
      - name: Restore TWRP source cache
        uses: actions/cache@v4
        with:
           path: twrp
           key: twrp-12.1-ubuntu-24.04-v1

      - name: Sync TWRP source
        run: |
          if [ ! -d "twrp/.repo" ]; then
          mkdir -p twrp
          cd twrp

          repo init \
              -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
              -b twrp-12.1

          repo sync -j2 --force-sync
          else
          echo "TWRP source restored from cache."
          echo "Skipping repo sync."
          fi
      # ==========================================
      # 6. Copy device tree AFTER TWRP sync
      # ==========================================
      - name: Copy device tree
        run: |
          mkdir -p twrp/device/xiaomi

          rm -rf twrp/device/xiaomi/dew

          cp -a device/xiaomi/dew \
            twrp/device/xiaomi/dew

          echo "=== TWRP device tree ==="
          find twrp/device/xiaomi/dew -maxdepth 3 -type f | sort

      # ==========================================
      # 7. Verify copied device tree
      # ==========================================
      - name: Verify copied device tree
        run: |
          echo "=== Required files ==="

          test -f twrp/device/xiaomi/dew/AndroidProducts.mk
          test -f twrp/device/xiaomi/dew/BoardConfig.mk
          test -f twrp/device/xiaomi/dew/device.mk
          test -f twrp/device/xiaomi/dew/twrp_dew.mk

          echo ""
          echo "=== BoardConfig architecture ==="

          grep -nE "TARGET_ARCH|TARGET_SUPPORTS_64_BIT_APPS" \
            twrp/device/xiaomi/dew/BoardConfig.mk || true

          echo ""
          echo "=== Dynamic partitions ==="

          grep -Rns "PRODUCT_USE_DYNAMIC_PARTITIONS" \
            twrp/device/xiaomi/dew || true

      # ==========================================
      # 8. Build TWRP
      # ==========================================
      - name: Build TWRP
        run: |
          cd twrp

          source build/envsetup.sh

          lunch twrp_dew-eng

          mka recoveryimage


