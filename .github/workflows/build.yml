

name: Build TWRP dew

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Check device tree
        run: |
          echo "=== Repository device tree ==="
          find device/xiaomi/dew -maxdepth 2 -type f -print

          echo "=== Check required files ==="
          test -f device/xiaomi/dew/AndroidProducts.mk
          test -f device/xiaomi/dew/BoardConfig.mk
          test -f device/xiaomi/dew/device.mk
          test -f device/xiaomi/dew/twrp_dew.mk

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            wget \
            zip \
            unzip \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libncurses5-dev \
            ccache \
            python3 \
            python3-pip \
            libxml2-utils \
            xsltproc \
            lz4 \
            zstd

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync clean TWRP 12.1
        run: |
          rm -rf twrp
          mkdir -p twrp
          cd twrp

          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

          repo sync -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --force-sync \
            -j"$(nproc)"

      - name: Copy device tree
        run: |
          mkdir -p twrp/device/xiaomi
          cp -a device/xiaomi/dew twrp/device/xiaomi/

          echo "=== TWRP device tree ==="
          find twrp/device/xiaomi/dew -maxdepth 2 -type f -print

          echo "=== Check copied device.mk ==="
          test -f twrp/device/xiaomi/dew/device.mk

      - name: Download prebuilt kernel
        run: |
          mkdir -p twrp/device/xiaomi/dew/prebuilt

          wget -O twrp/device/xiaomi/dew/prebuilt/kernel \
            "https://github.com/flyshootersicha-hue/twrp_dew/releases/download/kernel/kernel"

          chmod 644 twrp/device/xiaomi/dew/prebuilt/kernel

          echo "=== Kernel ==="
          ls -lh twrp/device/xiaomi/dew/prebuilt/kernel

          echo "=== Kernel file ==="
          file twrp/device/xiaomi/dew/prebuilt/kernel

          test -s twrp/device/xiaomi/dew/prebuilt/kernel

      - name: Debug recovery configuration
        run: |
          cd twrp

          echo "=== BoardConfig ==="
          grep -nE \
            "RECOVERY|VENDOR_BOOT|RAMDISK|KERNEL" \
            device/xiaomi/dew/BoardConfig.mk || true

          echo
          echo "=== Recovery variables in device tree ==="
          grep -R \
            "TARGET_NO_RECOVERY\|TW_HAS_NO_RECOVERY_PARTITION\|BOARD_MOVE_RECOVERY\|BOARD_INCLUDE_RECOVERY" \
            device/xiaomi/dew \
            2>/dev/null || true

      - name: Clean build output
        run: |
          cd twrp

          rm -rf out

          export OUT_DIR=out

          mkdir -p out/target/product/dew/root
          mkdir -p out/target/product/dew/recovery/root

          echo "=== Prepared output directories ==="
          find out/target/product/dew -maxdepth 2 -type d -print

      - name: Prepare recovery fstab
        run: |
          cp device/xiaomi/dew/prebuilt/fstab.mt6768 \
             device/xiaomi/dew/recovery.fstab

          echo "=== recovery.fstab ==="
          ls -lh device/xiaomi/dew/recovery.fstab
          head -n 30 device/xiaomi/dew/recovery.fstab

      - name: Build TWRP
        run: |
          cd twrp

          export OUT_DIR=out
          export ALLOW_MISSING_DEPENDENCIES=true
          export RECOVERY_VARIANT=twrp

          source build/envsetup.sh

          lunch twrp_dew-eng

          echo "=== Resolved variables ==="

          echo "TARGET_NO_RECOVERY:"
          get_build_var TARGET_NO_RECOVERY || true

          echo "TW_HAS_NO_RECOVERY_PARTITION:"
          get_build_var TW_HAS_NO_RECOVERY_PARTITION || true

          echo "BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT:"
          get_build_var BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT || true

          echo "TARGET_PREBUILT_KERNEL:"
          get_build_var TARGET_PREBUILT_KERNEL || true

          echo "OUT_DIR:"
          get_build_var OUT_DIR || true

          echo "PRODUCT_OUT:"
          get_build_var PRODUCT_OUT

          echo "=== Ensure output directories ==="
          mkdir -p "$ANDROID_PRODUCT_OUT/root"
          mkdir -p "$ANDROID_PRODUCT_OUT/recovery/root"

          echo "=== Build vendor_boot ==="
          mka -j"$(nproc)" vendorbootimage

      - name: Collect output
        if: always()
        run: |
          cd twrp

          mkdir -p output

          echo "=== Searching build outputs ==="

          if [ -f out/target/product/dew/vendor_boot.img ]; then
            cp -f \
              out/target/product/dew/vendor_boot.img \
              output/vendor_boot.img
          fi

          if [ -f out/target/product/dew/boot.img ]; then
            cp -f \
              out/target/product/dew/boot.img \
              output/boot.img
          fi

          if [ -f out/target/product/dew/recovery.img ]; then
            cp -f \
              out/target/product/dew/recovery.img \
              output/recovery.img
          fi

          echo
          echo "=== Final output ==="
          ls -lh output || true

      - name: Upload TWRP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-dew
          path: twrp/output/
          if-no-files-found: warn

      - name: Check build output
        if: always()
        run: |
          cd twrp

          echo "=== Product output ==="
          find out/target/product/dew \
            -maxdepth 2 \
            -type f \
            \( \
              -name "vendor_boot.img" \
              -o -name "boot.img" \
              -o -name "recovery.img" \
            \) \
            -print || true

          echo
          echo "=== Product directory ==="
          ls -lah out/target/product/dew || true
