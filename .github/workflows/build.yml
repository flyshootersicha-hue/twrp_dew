
name: Build TWRP dew

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Check device tree
        run: |
          echo "=== Repository device tree ==="
          find device/xiaomi/dew -maxdepth 2 -type f -print

          echo "=== Check device.mk ==="
          test -f device/xiaomi/dew/device.mk

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            zip \
            unzip \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libncurses5-dev \
            ccache \
            python3 \
            python3-pip \
            libxml2-utils \
            xsltproc \
            lz4 \
            zstd

      - name: Download prebuilt kernel
        run: |
          mkdir -p device/xiaomi/dew/prebuilt

          wget -O device/xiaomi/dew/prebuilt/kernel \
            "https://github.com/flyshootersicha-hue/twrp_dew/releases/download/kernel/kernel"

          chmod 644 device/xiaomi/dew/prebuilt/kernel

          echo "=== Kernel ==="
          ls -lh device/xiaomi/dew/prebuilt/kernel

      - name: Verify kernel
        run: |
          test -s device/xiaomi/dew/prebuilt/kernel

          file device/xiaomi/dew/prebuilt/kernel

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache TWRP source
        uses: actions/cache@v4
        with:
          path: twrp
          key: twrp-12.1-${{ runner.os }}

      - name: Sync clean TWRP 12.1
        run: |
           mkdir -p twrp
           cd twrp

            repo init --depth=1 \
                  -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
                  -b twrp-12.1

            repo sync -c \
                --no-clone-bundle \
                --no-tags \
                --optimized-fetch \
                --prune \
                --force-sync \
                -j$(nproc)

      - name: Copy dew device tree
        run: |
           mkdir -p twrp/device/xiaomi
           cp -a device/xiaomi/dew twrp/device/xiaomi/dew

      - name: Debug recovery configuration
        run: |
           echo "=== BoardConfig ==="
            grep -nE "RECOVERY|VENDOR_BOOT|RAMDISK|KERNEL" \
           device/xiaomi/dew/BoardConfig.mk || true

           echo "=== TWRP config ==="
           grep -R "TARGET_NO_RECOVERY\|BOARD_MOVE_RECOVERY" \
            device/xiaomi/dew vendor/twrp/build 2>/dev/null | head -100 || true

      - name: Build TWRP
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export RECOVERY_VARIANT=twrp
          
          source build/envsetup.sh
          lunch twrp_dew-eng
          mka -j$(nproc) vendorbootimage
