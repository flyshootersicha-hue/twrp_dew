name: Build TWRP

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - '12.1'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'twrp_dew-eng'
        type: choice
        options:
          - 'twrp_dew-eng'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm
          sudo docker image prune -a --force || true
          sudo docker system prune -a --volumes --force || true
          sudo apt-get clean
          df -h

      - name: Check device tree
        run: |
          echo "=== Repository device tree ==="
          find device/xiaomi/dew -maxdepth 2 -type f -print

          echo "=== Check device.mk ==="
          test -f device/xiaomi/dew/device.mk
          
      - name: Copy device tree
        run: |
          mkdir -p twrp/device/xiaomi
          cp -a device/xiaomi/dew twrp/device/xiaomi/

          echo "=== TWRP device tree ==="
          find twrp/device/xiaomi/dew -maxdepth 2 -type f -print

          echo "=== Check copied device.mk ==="
          test -f twrp/device/xiaomi/dew/device.mk

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32z1-dev libxml2-utils xsltproc unzip \
            python3 python-is-python3 rsync bc gperf libssl-dev \
            libncurses5-dev libncursesw5-dev \
            lz4 cpio liblzma-dev optipng

      - name: Install repo
        run: |
          mkdir -p ~/.local/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Sync TWRP source
        run: |
           mkdir -p twrp
           cd twrp

           if [ ! -d ".repo" ]; then
             repo init \
               -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
               -b twrp-12.1
            fi

           repo sync -j2 --force-sync

      - name: Download prebuilt kernel
        run: |
          mkdir -p device/xiaomi/dew/prebuilt

          wget -O device/xiaomi/dew/prebuilt/kernel \
            "https://github.com/flyshootersicha-hue/twrp_dew/releases/download/kernel/kernel"

          chmod 644 device/xiaomi/dew/prebuilt/kernel

          echo "=== Kernel ==="
          ls -lh device/xiaomi/dew/prebuilt/kernel

      - name: Build TWRP
        run: |
          cd twrp
          set +e
          source build/envsetup.sh
          set -e
          echo "=== Lunching target: ${{ github.event.inputs.BUILD_TARGET || 'twrp_dew-eng' }} ==="
          lunch ${{ github.event.inputs.BUILD_TARGET || 'twrp_dew-eng' }}
          echo "=== Building vendorbootimage ==="
          mka vendorbootimage

      - name: Show Build Output
        if: always()
        run: |
          find /twrp/out/target/product/dew -maxdepth 2 -type f || true

      - name: Fix Permissions
        if: always()
        run: |
          sudo chown -R runner:runner /twrp/out || true
          sudo chmod -R a+rX /twrp/out || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-dew
          if-no-files-found: warn
          path: |
            /twrp/out/target/product/dew/twrp*.zip
            /twrp/out/target/product/dew/twrp*.img
            /twrp/out/target/product/dew/vendor_boot.img
            /twrp/out/target/product/dew/vendorboot.img
            /twrp/out/target/product/dew/vendor_ramdisk_recovery.cpio
            /twrp/out/target/product/dew/recovery.img
            /twrp/out/target/product/dew/boot.img
