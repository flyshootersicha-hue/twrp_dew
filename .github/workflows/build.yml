name: Build TWRP dew

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Check device tree
        run: |
          echo "=== Repository device tree ==="
          find device/xiaomi/dew -maxdepth 2 -type f -print

          echo "=== Check required files ==="
          test -f device/xiaomi/dew/AndroidProducts.mk
          test -f device/xiaomi/dew/BoardConfig.mk
          test -f device/xiaomi/dew/device.mk
          test -f device/xiaomi/dew/twrp_dew.mk

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            wget \
            zip \
            unzip \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libncurses5-dev \
            ccache \
            python3 \
            python3-pip \
            libxml2-utils \
            xsltproc \
            lz4 \
            zstd

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache TWRP source
        uses: actions/cache@v4
        with:
          path: twrp
          key: twrp-12.1-${{ runner.os }}-${{ hashFiles('device/xiaomi/dew/BoardConfig.mk') }}

      - name: Sync clean TWRP 12.1
        run: |
          mkdir -p twrp
          cd twrp

          if [ ! -d .repo ]; then
            repo init --depth=1 \
              -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
              -b twrp-12.1
          fi

          repo sync -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --force-sync \
            -j"$(nproc)"

      - name: Copy dew device tree
        run: |
          rm -rf twrp/device/xiaomi/dew

          mkdir -p twrp/device/xiaomi

          cp -a device/xiaomi/dew \
            twrp/device/xiaomi/dew

          echo "=== Build device tree ==="
          find twrp/device/xiaomi/dew -maxdepth 2 -type f -print

      - name: Download prebuilt kernel
        run: |
          mkdir -p twrp/device/xiaomi/dew/prebuilt

          wget -O twrp/device/xiaomi/dew/prebuilt/kernel \
            "https://github.com/flyshootersicha-hue/twrp_dew/releases/download/kernel/kernel"

          chmod 644 twrp/device/xiaomi/dew/prebuilt/kernel

          echo "=== Kernel ==="
          ls -lh twrp/device/xiaomi/dew/prebuilt/kernel

          echo "=== Kernel type ==="
          file twrp/device/xiaomi/dew/prebuilt/kernel

      - name: Verify BoardConfig
        run: |
          cd twrp

          echo "=== BoardConfig.mk ==="
          cat device/xiaomi/dew/BoardConfig.mk

          echo
          echo "=== Recovery configuration ==="
          grep -nE \
            "TARGET_NO_RECOVERY|BOARD_MOVE_RECOVERY|BOARD_INCLUDE_RECOVERY|VENDOR_BOOT|RAMDISK|TARGET_PREBUILT_KERNEL" \
            device/xiaomi/dew/BoardConfig.mk || true

      - name: Clean build output
        run: |
          cd twrp
          rm -rf out

      - name: Build TWRP
        run: |
          cd twrp

          export ALLOW_MISSING_DEPENDENCIES=true
          export RECOVERY_VARIANT=twrp

          source build/envsetup.sh

          lunch twrp_dew-eng

          echo "=== Resolved build variables ==="
          get_build_var TARGET_NO_RECOVERY
          get_build_var BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT
          get_build_var BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT
          get_build_var TARGET_PREBUILT_KERNEL

          echo "=== Building vendor_bootimage ==="

          mka -j"$(nproc)" vendorbootimage

      - name: Check output
        run: |
          cd twrp

          echo "=== Build outputs ==="
          find out/target/product/dew \
            -maxdepth 2 \
            -type f \
            \( -name "vendor_boot.img" -o -name "boot.img" -o -name "recovery.img" \) \
            -print || true

          echo "=== Product directory ==="
          ls -lah out/target/product/dew || true
