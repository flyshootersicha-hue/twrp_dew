
name: Build TWRP dew

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Check device tree
        run: |
          echo "=== Repository device tree ==="
          find device/xiaomi/dew -maxdepth 2 -type f -print

          echo "=== Check device.mk ==="
          test -f device/xiaomi/dew/device.mk

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            curl \
            zip \
            unzip \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libncurses5-dev \
            ccache \
            python3 \
            python3-pip \
            libxml2-utils \
            xsltproc \
            lz4 \
            zstd

      - name: Download prebuilt kernel
        run: |
          mkdir -p device/xiaomi/dew/prebuilt

          wget -O device/xiaomi/dew/prebuilt/kernel \
            "https://github.com/flyshootersicha-hue/twrp_dew/releases/download/kernel/kernel"

          chmod 644 device/xiaomi/dew/prebuilt/kernel

          echo "=== Kernel ==="
          ls -lh device/xiaomi/dew/prebuilt/kernel

      - name: Verify kernel
        run: |
          test -s device/xiaomi/dew/prebuilt/kernel

          file device/xiaomi/dew/prebuilt/kernel

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache TWRP source
        uses: actions/cache@v4
        with:
          path: twrp
          key: twrp-12.1-${{ runner.os }}

      - name: Sync TWRP source
        run: |
           mkdir -p twrp
           cd twrp

           if [ ! -d ".repo" ]; then
             repo init \
               -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
               -b twrp-12.1
            fi

           repo sync -j2 --force-sync

      - name: Copy device tree
        run: |
          mkdir -p twrp/device/xiaomi
          cp -a device/xiaomi/dew twrp/device/xiaomi/

          echo "=== TWRP device tree ==="
          find twrp/device/xiaomi/dew -maxdepth 2 -type f -print

          echo "=== Check copied device.mk ==="
          test -f twrp/device/xiaomi/dew/device.mk

      -  name: Debug recovery configuration
         run: |
            echo "=== BoardConfig ==="
            grep -nE "RECOVERY|VENDOR_BOOT|RAMDISK|KERNEL" \
            device/xiaomi/dew/BoardConfig.mk || true

            echo "=== TWRP config ==="
            grep -R "TARGET_NO_RECOVERY\|BOARD_MOVE_RECOVERY" \
            device/xiaomi/dew vendor/twrp/build 2>/dev/null | head -100 || true
          

      - name: Build TWRP
        run: |
          cd twrp
          set +e
          source build/envsetup.sh
          set -e
          echo "=== Lunching target: ${{ github.event.inputs.BUILD_TARGET || 'twrp_dew-eng' }} ==="
          lunch ${{ github.event.inputs.BUILD_TARGET || 'twrp_dew-eng' }}
          echo "=== Building vendorbootimage ==="
          mka vendorbootimage
